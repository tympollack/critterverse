name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Unit tests, typecheck & filesize linting ───────────────
  test:
    name: Unit & Typecheck Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: File size lint
        run: npm run lint:filesize

      - name: Run unit tests
        run: npm test

  # ── Lint and type-check Edge Functions ─────────────────────
  lint-edge-functions:
    name: Lint & Type Check Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v1
        with:
          deno-version: '1.40.x'

      - name: Check formatting
        run: deno fmt --check supabase/functions/
        continue-on-error: true # non-blocking in CI for now

      - name: Lint
        run: deno lint supabase/functions/

      - name: Type check Edge Functions
        run: |
          for fn_dir in supabase/functions/*/; do
            for index_file in "$fn_dir"*/index.ts; do
              [ -f "$index_file" ] || continue
              echo "Checking: $index_file"
              deno check --import-map import_map.json "$index_file" || true
            done
          done
